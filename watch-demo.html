<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EatHalal — Order demo video (POC)</title>
  <meta name="description" content="Watch the EatHalal proof-of-concept order journey video." />
  <link rel="icon" href="assets/halaleat-mark.svg" type="image/svg+xml" />
  <style>
    :root { --g:#145c38; --gold:#ffcc00; --bg:#0a1a12; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, Segoe UI, sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    h1 { font-size: 1.35rem; margin: 0.75rem 0 0.35rem; text-align: center; }
    p { color: #b7c8be; text-align: center; margin-bottom: 1rem; font-size: 0.95rem; }
    .player {
      width: min(420px, 100%);
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
      border: 1px solid rgba(255,204,0,.25);
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      min-height: 280px;
      background: #000;
      aspect-ratio: 9 / 16;
      object-fit: contain;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-top: 1rem;
      max-width: 420px;
    }
    a, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font: inherit;
    }
    .primary { background: var(--gold); color: #111; }
    .ghost { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); }
    .note { margin-top: 1.25rem; font-size: 0.85rem; color: #8aa094; max-width: 36ch; }
  </style>
</head>
<body>
  <h1>EatHalal order demo video</h1>
  <p>Step-by-step POC · app → kitchen → pickup → mota → home</p>

  <div class="player">
    <video
      id="v"
      controls
      playsinline
      webkit-playsinline
      preload="auto"
      poster="demos/assets/poc-poster.jpg"
      src="demos/assets/go-poc-demo.mp4"
    >
      <source src="demos/assets/go-poc-demo.mp4" type="video/mp4" />
      Your browser cannot play this video.
      <a href="demos/assets/go-poc-demo.mp4">Download the MP4</a>
    </video>
  </div>

  <div class="actions">
    <button type="button" class="primary" id="play">▶ Play video</button>
    <a class="ghost" href="demos/assets/go-poc-demo.mp4" download>Download MP4</a>
    <a class="ghost" href="poc-demo.html">Full POC page</a>
  </div>
  <p class="note">If the player is blank, tap Play or open Download MP4. Direct file: /demos/assets/go-poc-demo.mp4</p>

  <script>
    var v = document.getElementById('v');
    document.getElementById('play').addEventListener('click', function () {
      v.muted = false;
      v.play().catch(function () {
        v.muted = true;
        v.play();
      });
    });
    // try autoplay muted so something is visibly moving
    v.muted = true;
    v.play().catch(function () {});
  </script>
</body>
</html>
